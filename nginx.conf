# Sirve el SPA Angular.
# En modo Caddy: Caddy enruta /api/* directo al backend y este bloque no se usa.
# En modo sin-TLS (frontend expuesto solo): Nginx también proxea /api al backend,
# así el contenedor es autosuficiente en el puerto 80.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API + login → backend Node/Express
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # gzip para los bundles
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets con hash en el nombre → cache largo e inmutable
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea (para que el deploy nuevo se vea al instante)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback SPA: cualquier ruta (incl. /login, /resumen, …) sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
